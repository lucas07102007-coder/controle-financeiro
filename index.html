<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bem-vindo | Controle Financeiro</title>

    <link rel="stylesheet" href="css/inicio.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
</head>

<body>

    <main class="inicio-container">

        <section class="inicio-card">

            <div class="icone-financeiro">
                $
            </div>

            <p class="subtitulo">CONTROLE FINANCEIRO</p>

            <h1>
                Bem Vindo, <span>Daniel!</span>
            </h1>

            <p class="descricao">
                Organize suas finanças de forma simples,
                rápida e segura.
            </p>

            <button id="btnEntrar">
                Entrar
            </button>

        </section>

    </main>

   <script>
    // Botão Entrar
    document.getElementById("btnEntrar").addEventListener("click", function () {
        window.location.href = "painel.html";
    });


    // Registrar o Service Worker
    if ("serviceWorker" in navigator) {

        window.addEventListener("load", function () {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(function () {
                    console.log("Service Worker registrado com sucesso!");
                })
                .catch(function (erro) {
                    console.log("Erro ao registrar Service Worker:", erro);
                });

        });

    }
</script>

</body>

</html>
